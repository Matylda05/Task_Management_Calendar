<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<button id="menuButton" class="menu" onclick="okno_zmien()">
    <img src="images/menu.png" alt="menu">
</button>
<div class="kalendarz_nav">
        <button class="PrevMonth" onclick="PrevMonth()"></button>
        <h1 class="month_name" id="month_name"></h1>
        <button class="nextMonth" onclick="nextMonth()"></button>
</div>
<h2 class="monthYear" id="monthYear"></h2>

<div class="container">
    <div class="left_side">
        <div class="task_list">
            <span>Task List</span>
            <span id="task_date"></span>
            <ul id="taskList" class="task-list">
            </ul>
        </div>
        <button class="add_button" onclick="okno_add()">ADD TASK</button>
    </div>

    <div class="kalendarz">
        <table id="calendar" ></table>
    </div>
</div>



<script src="script.js"></script>
</body>
</html>
